function RingChart({ value, max=100, color, bg='rgba(255,255,255,0.07)', size=56, sw=5.5 }) {
  const r = (size - sw) / 2;
  const circ = 2 * Math.PI * r;
  const pct = Math.min(value / max, 1);
  return (
    <div style={{ position:'relative', width:size, height:size, flexShrink:0 }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}
        style={{ transform:'rotate(-90deg)' }}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={bg} strokeWidth={sw}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color}
          strokeWidth={sw} strokeLinecap="round"
          strokeDasharray={`${circ*pct} ${circ*(1-pct)}`}/>
      </svg>
      <div style={{ position:'absolute', inset:0, display:'flex', flexDirection:'column',
        alignItems:'center', justifyContent:'center', gap:1 }}>
        <span style={{ fontSize:12, fontWeight:700, color:'#fff', lineHeight:1,
          fontFamily:'Space Mono, monospace' }}>{value}%</span>
      </div>
    </div>
  );
}

function SparkLine({ t, scores }) {
  const W = 210, H = 38;
  const min = Math.min(...scores), max = Math.max(...scores), range = max - min || 1;
  const pts = scores.map((s,i)=>({
    x: (i/(scores.length-1))*W,
    y: H - 4 - ((s-min)/range)*(H-8),
  }));
  const poly = pts.map(p=>`${p.x},${p.y}`).join(' ');
  return (
    <svg width={W} height={H} style={{ overflow:'visible' }}>
      <defs>
        <linearGradient id={`spark-${t.key}`} x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stopColor={t.accent} stopOpacity="0.5"/>
          <stop offset="100%" stopColor={t.accent}/>
        </linearGradient>
      </defs>
      <polyline points={poly} fill="none" stroke={`url(#spark-${t.key})`}
        strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/>
      {pts.map((p,i)=>(
        <circle key={i} cx={p.x} cy={p.y}
          r={i===pts.length-1?3.5:2}
          fill={i===pts.length-1?t.accent:'rgba(255,255,255,0.3)'}/>
      ))}
    </svg>
  );
}

/* ─────────────────────────────────────────────────────────────────────
   DARK FAIRWAY MAP
───────────────────────────────────────────────────────────────────── */
const FW_MARKERS = [
  {yd:300,y:19},{yd:250,y:33},{yd:200,y:47},{yd:150,y:62},{yd:100,y:76},{yd:50,y:90},
];
const SHAPE_CURVE = { Straight:0, Draw:5, Fade:-5, Hook:12, Slice:-12 };
const FW_OVL = { cx:50, cy:55, rx:17, ry:38 };

function fwCurveCP(x1,y1,x2,y2,curv) {
  const mx=(x1+x2)/2, my=(y1+y2)/2;
  if(!curv) return {cpx:mx,cpy:my};
  const dx=x2-x1, dy=y2-y1, len=Math.sqrt(dx*dx+dy*dy)||1;
  return {cpx:mx+(dy/len)*curv, cpy:my+(-dx/len)*curv};
}

function DarkFairwayMap({ t, shots }) {
  const sorted = [...shots].sort((a,b)=>a.shotNumber-b.shotNumber);
  const gradId = `fw-grad-${t.key}`;
  return (
    <div style={{ background:t.fwBg, display:'flex', justifyContent:'center' }}>
      <svg viewBox="0 0 100 108" style={{ width:'100%', maxWidth:310, display:'block' }}>
        <defs>
          <radialGradient id={gradId} cx="50%" cy="40%" r="60%">
            <stop offset="0%" stopColor={t.fwFairwayLight}/>
            <stop offset="100%" stopColor={t.fwFairway}/>
          </radialGradient>
          <filter id={`glow-${t.key}`} x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="1.8" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        {/* Background rough */}
        <rect x="0" y="0" width="100" height="108" fill={t.fwBg}/>

        {/* Fairway oval */}
        <ellipse cx={FW_OVL.cx} cy={FW_OVL.cy} rx={FW_OVL.rx} ry={FW_OVL.ry}
          fill={`url(#${gradId})`}/>
        <ellipse cx={FW_OVL.cx} cy={FW_OVL.cy} rx={FW_OVL.rx} ry={FW_OVL.ry}
          fill="none" stroke={t.accent} strokeWidth="0.5" opacity="0.25"/>

        {/* Distance markers */}
        {FW_MARKERS.map(({yd,y})=>{
          const dy2 = y - FW_OVL.cy;
          const chord = FW_OVL.rx * Math.sqrt(Math.max(0, 1-(dy2*dy2)/(FW_OVL.ry*FW_OVL.ry)));
          return (
            <g key={yd}>
              <line x1={FW_OVL.cx-chord} y1={y} x2={FW_OVL.cx+chord} y2={y}
                stroke={t.accent} strokeWidth="0.3" opacity="0.2" strokeDasharray="1.5,2"/>
              <text x={FW_OVL.cx+chord+1.5} y={y+1.3}
                fontSize="3.2" fill={t.accent} opacity="0.45" fontWeight="600"
                fontFamily="Space Mono, monospace">{yd}</text>
            </g>
          );
        })}

        {/* Shot paths */}
        {sorted.length > 0 && (()=>{
          const s = sorted[0];
          const curv = SHAPE_CURVE[s.shape]||0;
          const {cpx,cpy} = fwCurveCP(50, 96.5, s.x, s.y, curv);
          return <path d={`M 50,96.5 Q ${cpx},${cpy} ${s.x},${s.y}`}
            stroke={t.accent} fill="none" strokeWidth="0.8" strokeDasharray="2,2" opacity="0.7"/>;
        })()}
        {sorted.length > 1 && sorted.map((shot,i)=>{
          if(i===0) return null;
          const prev = sorted[i-1];
          const curv = SHAPE_CURVE[shot.shape]||0;
          const {cpx,cpy} = fwCurveCP(prev.x,prev.y,shot.x,shot.y,curv);
          return <path key={shot.id}
            d={`M ${prev.x},${prev.y} Q ${cpx},${cpy} ${shot.x},${shot.y}`}
            stroke={t.accent} fill="none" strokeWidth="0.8" strokeDasharray="2,2" opacity="0.7"/>;
        })}

        {/* Shot markers */}
        {shots.map(shot=>(
          <g key={shot.id} transform={`translate(${shot.x},${shot.y})`}
            filter={`url(#glow-${t.key})`}>
            <circle r={5.5} fill={t.accentGlow}/>
            <circle r={3.8} fill={t.accent}/>
            <text x={0} y={1.4} textAnchor="middle" fontSize="3.2" fontWeight="700"
              fill={t.bg} fontFamily="Space Grotesk, sans-serif">{shot.shotNumber}</text>
          </g>
        ))}

        {/* Tee */}
        <circle cx="50" cy="100" r="3.5" fill={t.accent} opacity="0.9"/>
        <circle cx="50" cy="100" r="1.4" fill={t.bg} opacity="0.8"/>
      </svg>
    </div>
  );
}

/* ─────────────────────────────────────────────────────────────────────
   DARK GREEN MAP
───────────────────────────────────────────────────────────────────── */
const GRN = { cx:50, cy:25, r:20 };
const APPR_TOP = GRN.cy + GRN.r; // 45
const APPR_BOT = 195;
const APPR_PATH_D = `M 30,${APPR_TOP} L 12,${APPR_BOT} Q 50,207 88,${APPR_BOT} L 70,${APPR_TOP} Z`;
const APPR_MARKS = Array.from({length:10},(_,i)=>({
  yd:(i+1)*25,
  y:APPR_TOP+(i+1)*25*((APPR_BOT-APPR_TOP)/250),
  labeled:((i+1)*25)%50===0,
}));
function apprEdge(y) {
  const t2=Math.max(0,Math.min(1,(y-APPR_TOP)/(APPR_BOT-APPR_TOP)));
  return { lx:30+(12-30)*t2, rx:70+(88-70)*t2 };
}

function DarkGreenMap({ t, shots }) {
  const sorted = [...shots].sort((a,b)=>a.shotNumber-b.shotNumber);
  const gradId = `grn-${t.key}`;
  return (
    <div style={{ background:t.grnBg, display:'flex', justifyContent:'center' }}>
      <svg viewBox="0 0 100 210" style={{ width:'100%', maxWidth:240, display:'block' }}>
        <defs>
          <radialGradient id={gradId} cx="50%" cy="50%" r="50%">
            <stop offset="0%" stopColor={t.grnCenter}/>
            <stop offset="55%" stopColor={t.grnInner}/>
            <stop offset="80%" stopColor={t.grnMid}/>
            <stop offset="100%" stopColor={t.grnOuter}/>
          </radialGradient>
          <filter id={`grn-glow-${t.key}`} x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="2" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        {/* Rough */}
        <rect x="0" y="0" width="100" height="210" fill={t.grnBg}/>
        {/* Approach corridor */}
        <path d={APPR_PATH_D} fill={t.apprFill}/>
        <path d={APPR_PATH_D} fill="none" stroke={t.accent} strokeWidth="0.4" opacity="0.12"/>

        {/* Yardage lines */}
        {APPR_MARKS.map(({yd,y,labeled})=>{
          const {lx,rx}=apprEdge(y);
          return (
            <g key={yd}>
              <line x1={lx} y1={y} x2={rx} y2={y} stroke={t.accent}
                strokeWidth={labeled?.5:.3} strokeDasharray="1.5,2"
                opacity={labeled?.28:.14}/>
              {labeled && <text x={rx+1.5} y={y+1.2} fontSize="3" fill={t.accent}
                opacity="0.45" fontWeight="600" fontFamily="Space Mono">{yd}</text>}
            </g>
          );
        })}

        {/* Bunkers */}
        <ellipse cx="30" cy="44" rx="11" ry="5" fill={t.bg}
          stroke={t.border} strokeWidth="0.5" transform="rotate(-30 30 44)" opacity="0.7"/>
        <ellipse cx="70" cy="44" rx="11" ry="5" fill={t.bg}
          stroke={t.border} strokeWidth="0.5" transform="rotate(30 70 44)" opacity="0.7"/>

        {/* Green */}
        <circle cx={GRN.cx} cy={GRN.cy} r={GRN.r} fill={`url(#${gradId})`}/>
        {/* Distance rings */}
        {[1, 2/3, 1/3].map((frac,i)=>(
          <circle key={i} cx={GRN.cx} cy={GRN.cy} r={GRN.r*frac} fill="none"
            stroke={t.accent} strokeWidth="0.4" opacity={0.35-i*0.1}/>
        ))}
        {/* Distance labels */}
        <text x={GRN.cx+GRN.r-0.5} y={GRN.cy-2} textAnchor="end" fontSize="2.8"
          fill={t.accent} opacity="0.5" fontWeight="600" fontFamily="Space Mono">30ft</text>
        <text x={GRN.cx+GRN.r*2/3-0.5} y={GRN.cy-1} textAnchor="end" fontSize="2.6"
          fill={t.accent} opacity="0.45" fontWeight="600" fontFamily="Space Mono">20ft</text>
        <text x={GRN.cx+GRN.r/3-0.5} y={GRN.cy-1} textAnchor="end" fontSize="2.4"
          fill={t.accent} opacity="0.4" fontWeight="600" fontFamily="Space Mono">10ft</text>

        {/* Pin */}
        <line x1={GRN.cx} y1={GRN.cy-1.5} x2={GRN.cx} y2={GRN.cy-10}
          stroke={t.text} strokeWidth="0.7" strokeLinecap="round" opacity="0.9"/>
        <polygon points={`${GRN.cx},${GRN.cy-10} ${GRN.cx+4.5},${GRN.cy-7.5} ${GRN.cx},${GRN.cy-5}`}
          fill="#ef4444"/>
        <circle cx={GRN.cx} cy={GRN.cy} r={1.5} fill={t.grnCenter}
          stroke={t.accent} strokeWidth="0.6" opacity="0.8"/>

        {/* Shot paths */}
        {sorted.length > 1 && sorted.map((shot,i)=>{
          if(i===0) return null;
          const prev = sorted[i-1];
          return <line key={shot.id} x1={prev.x} y1={prev.y} x2={shot.x} y2={shot.y}
            stroke={t.accent} strokeWidth="0.8" strokeDasharray="2,2" opacity="0.7"/>;
        })}

        {/* Shot markers */}
        {shots.map(shot=>(
          <g key={shot.id} transform={`translate(${shot.x},${shot.y})`}

function FairwayScreen({ t }) {
  const [activeHole, setActiveHole] = useState(7);
  const TABS = Array.from({length:9},(_,i)=>i+1);

  function holeChip(h) {
    const s = HOLE_SCORES[h], p = HOLE_PARS[h];
    const isActive = h === activeHole;
    if (isActive) return { bg:'#fff', numColor:'#111', scoreColor:'#111', border:'transparent' };
    if (!s) return { bg:t.surface2, numColor:t.textFaint, scoreColor:t.textFaint, border:t.border };
    const d = s - p;
    if (d<=-2) return { bg:'#78350f', numColor:'#fde68a', scoreColor:'#fde68a', border:'#f59e0b' };
    if (d===-1) return { bg:'#7f1d1d', numColor:'#fca5a5', scoreColor:'#fca5a5', border:'#ef4444' };
    if (d===0)  return { bg:t.accentSoft, numColor:t.accent, scoreColor:t.accent, border:t.accent };
    if (d===1)  return { bg:'rgba(59,130,246,0.18)', numColor:'#93c5fd', scoreColor:'#93c5fd', border:'#3b82f6' };
    return { bg:t.surface2, numColor:t.textSub, scoreColor:t.textSub, border:t.border };

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100%', background:t.bg,

      <div style={{ background:t.bg, padding:'8px 10px', display:'flex', gap:5, overflowX:'auto',
        flexShrink:0, borderBottom:`1px solid ${t.border}` }} className="pp-noscroll">
        {TABS.map(h=>{
          const chip = holeChip(h);

            <div key={h} onClick={()=>setActiveHole(h)} style={{ flexShrink:0, width:34, height:34,

              background:chip.bg, border:`1px solid ${chip.border}` }}>
              <span style={{ fontSize:9, lineHeight:1, color:chip.numColor, fontWeight:600 }}>{h}</span>

        </DCSection>

        <DCSection id="s3" title="Shot Analysis — Approach &amp; Green">
          <DCArtboard id="c1" label={`A · ${tA.name}`} width={390} height={844}>
            <PhoneFrame><GreenScreen t={tA}/></PhoneFrame>
          </DCArtboard>
          <DCArtboard id="c2" label={`B · ${tB.name}`} width={390} height={844}>
            <PhoneFrame><GreenScreen t={tB}/></PhoneFrame>
          </DCArtboard>
          <DCArtboard id="c3" label={`C · ${tC.name}`} width={390} height={844}>
            <PhoneFrame><GreenScreen t={tC}/></PhoneFrame>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel>
        <TweakSection title="Column A Theme">
          <TweakRadio id="themeA" options={THEME_OPTS} value={tweaks.themeA}
            onChange={v=>setTweak('themeA',v)}/>
        </TweakSection>
        <TweakSection title="Column B Theme">
          <TweakRadio id="themeB" options={THEME_OPTS} value={tweaks.themeB}
            onChange={v=>setTweak('themeB',v)}/>
        </TweakSection>
        <TweakSection title="Column C Theme">
          <TweakRadio id="themeC" options={THEME_OPTS} value={tweaks.themeC}
            onChange={v=>setTweak('themeC',v)}/>
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
